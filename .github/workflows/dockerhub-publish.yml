name: Docker Hub — Publish Images (elayarifarah)

# Builds and publishes the Al Baraka Bank Assistant + RAGLab container images
# to project owner Ayari Farah's Docker Hub namespace (`elayarifarah`) using
# the `DOCKER_HUB_ACCESS_TOKEN` repository secret:
#   - elayarifarah/albaraka-raglab
#   - elayarifarah/albaraka-backend
#   - elayarifarah/albaraka-frontend

on:
  push:
    branches:
      - main
      - master
      - 'arena/**'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: dockerhub-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_USERNAME: elayarifarah

jobs:
  publish:
    name: Build & push (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: raglab
            image: elayarifarah/albaraka-raglab
            context: ./RAGLab
            dockerfile: ./RAGLab/Dockerfile
          - service: backend
            image: elayarifarah/albaraka-backend
            context: ./bank-assistant/backend
            dockerfile: ./bank-assistant/backend/Dockerfile
          - service: frontend
            image: elayarifarah/albaraka-frontend
            context: ./bank-assistant/frontend
            dockerfile: ./bank-assistant/frontend/Dockerfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify DOCKER_HUB_ACCESS_TOKEN secret is configured
        env:
          TOKEN_SET: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN != '' }}
        run: |
          if [ "$TOKEN_SET" != "true" ]; then
            echo "::error::DOCKER_HUB_ACCESS_TOKEN secret is missing in GitHub repository settings."
            exit 1
          fi

      - name: Compute image tags and build metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BRANCH_NAME="${GITHUB_REF_NAME}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          TAGS="${{ matrix.image }}:latest,${{ matrix.image }}:sha-${SHORT_SHA}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS="${TAGS},${{ matrix.image }}:${VERSION}"
          fi
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH_NAME}" >> "$GITHUB_OUTPUT"
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Publishing tags: ${TAGS}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub as elayarifarah (Ayari Farah)
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.short_sha }}
            GIT_BRANCH=${{ steps.meta.outputs.branch }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          labels: |
            org.opencontainers.image.title=Al Baraka ${{ matrix.service }}
            org.opencontainers.image.authors=Ayari Farah
            org.opencontainers.image.vendor=Ayari Farah
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=dockerhub-${{ matrix.service }}
          cache-to: type=gha,scope=dockerhub-${{ matrix.service }},mode=max

      - name: Publish summary annotation
        if: success()
        run: |
          echo "::notice::Published ${{ steps.meta.outputs.tags }} (digest=${{ steps.build_push.outputs.digest }}) to Docker Hub user ${{ env.DOCKERHUB_USERNAME }}"

