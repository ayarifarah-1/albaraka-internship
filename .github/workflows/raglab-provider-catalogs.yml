name: RAGLab provider catalog diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  catalogs:
    name: Read-only Qwen availability and pricing metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: RAGLab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Inspect catalogs (no documents, queries, or inference)
        env:
          XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
        run: python raglab/provider_catalog.py

      - name: Publish credential-free catalog metadata
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python raglab/provider_catalog.py --publish

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raglab-provider-catalogs
          path: RAGLab/raglab/results/provider_catalog/
          retention-days: 14
          if-no-files-found: warn
